<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AnimeZone - Earning</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
:root { --primary: #7C3AED; }

body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #1a1a2e;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 12px;
  background: #ffffff;
  border-bottom: 1px solid #f0f0f0;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #F3F4F6;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.back-btn .material-icons-round { font-size: 20px; color: #374151; }
.page-title { font-size: 17px; font-weight: 800; }

.scroll-area { flex: 1; overflow-y: auto; padding: 16px; }
.scroll-area::-webkit-scrollbar { display: none; }

.balance-card {
  background: linear-gradient(135deg, #7C3AED, #A78BFA);
  border-radius: 18px;
  padding: 24px 20px;
  color: white;
  text-align: center;
  margin-bottom: 20px;
}
.balance-label { font-size: 12px; opacity: 0.85; }
.balance-amount { font-size: 32px; font-weight: 800; margin-top: 6px; }

.info-card {
  background: #F9FAFB;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.info-icon {
  width: 38px; height: 38px; border-radius: 50%;
  background: #EDE9FE; color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.info-text h4 { font-size: 13.5px; font-weight: 700; }
.info-text p { font-size: 11.5px; color: #9CA3AF; margin-top: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" onclick="window.location.href='index.html'">
    <span class="material-icons-round">arrow_back</span>
  </div>
  <div class="page-title">Earning</div>
</div>

<div class="scroll-area">
  <div class="balance-card">
    <div class="balance-label">Your Balance</div>
    <div class="balance-amount">₹0</div>
  </div>

  <div class="info-card">
    <div class="info-icon"><span class="material-icons-round">visibility</span></div>
    <div class="info-text">
      <h4>Watch & Earn</h4>
      <p>Videos dekh kar earning karein — jald hi available</p>
    </div>
  </div>

  <div class="info-card">
    <div class="info-icon"><span class="material-icons-round">group_add</span></div>
    <div class="info-text">
      <h4>Refer & Earn</h4>
      <p>Dosto ko invite karke bonus paayein — jald hi available</p>
    </div>
  </div>
</div>

</body>
</html>
