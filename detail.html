<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AnimeZone - Detail</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='11482366' data-sdk='show_11482366'></script>

<style>
/* CSS Wahi rahega jo pichle code mein tha (Crunchyroll Style) */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
:root { --primary: #7C3AED; --primary-dark: #5B21B6; }
body { font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a2e; height: 100vh; overflow-y: auto; }
body::-webkit-scrollbar { display: none; }
.hero-wrap { position: relative; width: 100%; height: 500px; overflow: hidden; }
.hero-img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 70%, rgba(255,255,255,1) 100%); }
.back-btn { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.back-btn .material-icons-round { font-size: 28px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.content { padding: 0 16px 100px; margin-top: -30px; position: relative; }
.anime-title { font-size: 26px; font-weight: 900; color: #1a1a2e; line-height: 1.2; margin-bottom: 8px; }
.meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.meta-badge { background: #F3F4F6; color: #6B7280; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }
.meta-badge.primary { background: #EDE9FE; color: var(--primary); }
.description { font-size: 13px; color: #6B7280; line-height: 1.6; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more-btn { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px; display: inline-block; }
.tabs { display: flex; border-bottom: 2px solid #F3F4F6; margin-bottom: 16px; }
.tab { padding: 10px 16px; font-size: 13px; font-weight: 600; color: #9CA3AF; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.ep-list { display: flex; flex-direction: column; gap: 18px; }
.ep-card { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; position: relative; min-height: 80px; }
.ep-thumb { width: 140px; height: 80px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #f3f3f3; position: relative; }
.ep-thumb img { width: 100%; height: 100%; object-fit: cover; }
.ep-thumb .duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); color: white; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; }
.ep-info { flex: 1; display: flex; flex-direction: column; padding-top: 2px; }
.ep-info h4 { font-size: 14px; font-weight: 700; color: #1a1a2e; margin-bottom: 2px; line-height: 1.2; }
.ep-info p { font-size: 11px; color: #9CA3AF; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep-actions { display: flex; gap: 12px; position: absolute; right: 0; bottom: 4px; flex-direction: row; align-items: center; }
.ep-dl .material-icons-round { font-size: 22px; color: #1a1a2e; opacity: 0.7; }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 16px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; align-items: center; }
.watch-now-btn { flex: 1; background: var(--primary); color: white; border: none; padding: 14px 0; border-radius: 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
</style>
</head>
<body>

<div class="hero-wrap">
  <img class="hero-img" id="heroImg" src="" alt="Anime" style="background:#F3F4F6;">
  <div class="hero-overlay"></div>
  <div class="back-btn" onclick="history.back()">
    <span class="material-icons-round">arrow_back</span>
  </div>
</div>

<div class="content">
  <div class="anime-title" id="animeTitle"></div>
  <div class="meta-row" id="metaRow">
    <span class="meta-badge primary" id="ageRatingBadge">—</span>
  </div>
  <p class="description" id="animeDesc"></p>
  <span class="more-btn">More Details</span>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'episodes')">Episodes</div>
    <div class="tab" onclick="switchTab(this,'more')">More Like This</div>
  </div>

  <div class="ep-list" id="episodes"></div>
</div>

<div class="bottom-bar">
  <button class="watch-now-btn" id="watchNowBtn">
    <span class="material-icons-round">play_arrow</span>
    <span id="watchNowLabel">Start Watching</span>
  </button>
</div>

<script>
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();

const API_BASE = "https://explorer-ease-bacon-permissions.trycloudflare.com";
const tg = window.Telegram.WebApp;
const params = new URLSearchParams(window.location.search);
const animeId = params.get('id');

let animeData = null;

// --- ADVANCED DNS DETECTION ---
async function isAdBlockOrDNSActive() {
    // Check 1: Agar SDK variable hi nahi mila
    if (typeof window.show_11482366 !== 'function') return true;

    // Check 2: Try to fetch Monetag domain (Sabse solid DNS check)
    try {
        const testRequest = await fetch('https://libtl.com/sdk.js', {
            mode: 'no-cors',
            cache: 'no-store'
        });
        return false; // Request reach ho gayi, matlab DNS off hai
    } catch (e) {
        return true; // Connection blocked, matlab AdGuard/DNS on hai
    }
}

async function openEpisode(deeplink) {
    // Buttons click hone par check karein
    const isBlocked = await isAdBlockOrDNSActive();
    
    if (isBlocked) {
        alert("⚠️ DNS / AdGuard Detected!\n\nPlease disable Private DNS or Ad-blocker to play episodes. We need ads to keep this app free.");
        return;
    }

    // Agar block nahi hai, toh ad dikhao
    try {
        window.show_11482366().then(() => {
            tg.openTelegramLink(deeplink);
        }).catch(() => {
            tg.openTelegramLink(deeplink);
        });
    } catch (err) {
        tg.openTelegramLink(deeplink);
    }
}

// Baki render logic (Jo pehle tha wahi use karein)
async function loadAnimeDetail() {
  if (!animeId) return;
  try {
    const res = await fetch(`${API_BASE}/api/anime/${animeId}`);
    animeData = await res.json();
    renderDetail();
  } catch (err) { console.error(err); }
}

function renderDetail() {
  document.getElementById('animeTitle').textContent = animeData.name;
  document.getElementById('heroImg').src = animeData.thumbnail;
  document.getElementById('animeDesc').textContent = animeData.description || 'No description.';

  const epListEl = document.getElementById('episodes');
  epListEl.innerHTML = animeData.episodes.map((ep) => `
    <div class="ep-card">
      <div class="ep-thumb" onclick="openEpisode('${ep.deeplink}')">
        <img src="${ep.thumbnail}" alt="${ep.title}">
        ${ep.duration ? `<div class="duration">${ep.duration}</div>` : ''}
      </div>
      <div class="ep-info" onclick="openEpisode('${ep.deeplink}')">
        <h4>${ep.title}</h4>
        ${ep.description ? `<p>${ep.description}</p>` : ''}
      </div>
      <div class="ep-actions">
        <div class="ep-dl" onclick="event.stopPropagation()">
          <span class="material-icons-round">download</span>
        </div>
        <div class="ep-dl" onclick="event.stopPropagation(); shareEpisode('${ep.title.replace(/'/g, "\\'")}', '${ep.deeplink}')">
          <span class="material-icons-round">share</span>
        </div>
      </div>
    </div>
  `).join('');

  if (animeData.episodes.length > 0) {
    const firstEp = animeData.episodes[0];
    document.getElementById('watchNowBtn').onclick = () => openEpisode(firstEp.deeplink);
  }
}

function shareEpisode(title, deeplink) {
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(deeplink)}&text=${encodeURIComponent(title)}`;
  tg.openTelegramLink(shareUrl);
}

function switchTab(el, tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

loadAnimeDetail();
</script>
</body>
</html>
