<style>
/* =====================================================================
   THEME — dark crimson (shared by all pages)
   Pages: collections.html, store.html, profile.html
   (Content), profile.html
   ===================================================================== */
:root {
  --accent: #E8294F;
  --accent-2: #F0476A;
  --gold: #FBBF24;
  --text: #ffffff;
  --muted: #a99ca2;
  --line: rgba(255, 255, 255, 0.10);
  --panel: rgba(9, 3, 7, 0.88);
  --page-bg: linear-gradient(180deg, #36000f 0%, #19000a 36%, #0b0005 62%, #2f000e 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  background: var(--page-bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { font-family: inherit; }

/* ---------- page layout ---------- */
.page {
  flex: 1; min-height: 0; overflow-y: auto;
  /* Telegram fullscreen mode mein upar Close button / neeche system bar ke liye jagah (app.js --safe-top / --safe-bottom set karta hai) */
  padding: calc(var(--safe-top, 0px) + 8px) 16px calc(120px + var(--safe-bottom, 0px));
  animation: pageIn 0.28s ease backwards;
}
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
body.leaving .page { opacity: 0; transform: translateY(-8px); transition: opacity 0.14s ease, transform 0.14s ease; }
.page::-webkit-scrollbar { display: none; }
.page-title { font-size: 34px; font-weight: 800; letter-spacing: -1px; padding: 22px 4px 18px; }
.section-title { font-size: 22px; font-weight: 800; padding: 26px 4px 6px; }
.muted { color: var(--muted); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; }


/* ---------- buttons ---------- */
.btn-row { display: flex; gap: 12px; }
.btn {
  flex: 1; height: 54px; border: none; border-radius: 20px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 17px; font-weight: 700; color: #fff; cursor: pointer;
}
.btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--accent); box-shadow: 0 8px 22px rgba(232, 41, 79, 0.35); }
.btn.dark { background: #1a1316; border: 1px solid var(--line); }

/* ---------- floating bottom navigation (sliding pill) ---------- */
.app-nav {
  position: fixed; left: 14px; right: 14px; bottom: calc(14px + var(--safe-bottom, 0px)); height: 74px; z-index: 40;
  display: flex; align-items: center; padding: 7px;
  background: rgba(20, 14, 18, 0.94); border: 1px solid var(--line); border-radius: 34px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
/* active tab ka highlight: ek pill jo tab se tab slide karti hai */
.nav-pill {
  position: absolute; top: 7px; bottom: 7px; left: 7px; width: calc((100% - 14px) / 4);
  border-radius: 27px; background: #2a2327; z-index: 0; will-change: transform;
  transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
}
.nav-btn {
  position: relative; z-index: 1; flex: 1; min-width: 0; height: 100%; border: none; background: none; border-radius: 27px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: #b9acb2; font-size: 11.5px; font-weight: 500; cursor: pointer; transition: color 0.3s ease;
}
.nav-btn svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn.active { color: var(--accent-2); }

/* ---------- toast ---------- */
#appToast {
  position: fixed; left: 50%; bottom: calc(106px + var(--safe-bottom, 0px)); transform: translateX(-50%);
  background: rgba(30, 20, 26, 0.96); border: 1px solid var(--line); color: #fff;
  font-size: 13px; font-weight: 600; padding: 11px 18px; border-radius: 999px;
  z-index: 90; max-width: 86%; text-align: center; display: none;
}
#appToast.show { display: block; }

</style>
<style>

/* ===== Content page ===== */
.adfree-chip { display: none; margin: -8px 4px 14px; padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800; color: #FBBF24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.4); }
.sent-bar { position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom, 0px) + 96px); z-index: 60; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; font-size: 13.5px; font-weight: 700; line-height: 1.4; color: #fff; background: rgba(16,185,129,0.95); box-shadow: 0 10px 30px rgba(0,0,0,0.4); transform: translateY(30px); opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s; }
.sent-bar.show { transform: none; opacity: 1; pointer-events: auto; }
.sent-bar.err { background: rgba(220,38,38,0.95); }
.sent-bar span { flex: 1; }
.sent-bar button { flex: none; height: 34px; padding: 0 14px; border: none; border-radius: 12px; background: rgba(255,255,255,0.95); color: #065F46; font-family: inherit; font-size: 13px; font-weight: 800; }
.search-tap {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  background: rgba(255,255,255,0.07); border: 1px solid var(--line);
  border-radius: 22px; padding: 13px 16px;
}
.search-tap svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
.search-tap input { border: none; background: transparent; width: 100%; color: #fff; font-size: 15px; font-family: inherit; }
.search-tap input::placeholder { color: var(--muted); }

.filter-row { display: flex; gap: 8px; padding: 2px 0 12px; overflow-x: auto; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-pill {
  flex-shrink: 0; background: rgba(255,255,255,0.07); border: 1px solid transparent; color: #cbbfc5;
  font-family: inherit; font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 20px;
  white-space: nowrap; cursor: pointer;
}
.filter-pill.active { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(232,41,79,0.3); }

.exclusive-banner {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin: 4px 0 18px;
  background: linear-gradient(135deg, rgba(232,41,79,0.20), rgba(232,41,79,0.06));
  border: 1px solid rgba(232,41,79,0.4); border-radius: 24px;
}
.banner-ico { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 16px rgba(232,41,79,0.35); }
.banner-ico svg { width: 20px; height: 20px; fill: #fff; }
.exclusive-banner-text h2 { font-size: 15px; font-weight: 800; color: #ffe3e8; }
.exclusive-banner-text p { font-size: 12px; color: #f3a9b8; margin-top: 2px; }

.content-grid { display: flex; flex-direction: column; gap: 18px; margin: 0 0 20px; }
.content-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 28px; overflow: hidden;
  box-shadow: 0 10px 28px rgba(0,0,0,0.4);
}
.content-thumb { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #150a0f; }
/* poori image bina kheenche dikhti hai (contain); khaali jagah usi image ke halke blur se bharti hai */
.thumb-bg { position: absolute; inset: -24px; background-size: cover; background-position: center; filter: blur(24px) brightness(0.75) saturate(1.25); }
.thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.content-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 55%); pointer-events: none; }

.thumb-fallback {
  display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  text-align: center; padding: 20px 20px 90px; color: #e9c9d2; font-size: 13px; font-weight: 600;
  background: radial-gradient(circle at 50% 38%, #5a0a25 0%, #1b0510 72%); background-size: cover; background-position: center;
}
.thumb-fallback svg { width: 54px; height: 54px; color: var(--accent-2); }
.content-thumb.no-img .thumb-fallback { display: flex; }
.content-thumb.no-img .thumb-bg, .content-thumb.no-img .thumb-img { display: none; }

.content-title-overlay { position: absolute; bottom: 48px; left: 16px; right: 16px; z-index: 2; color: #fff; font-size: 20px; font-weight: 800; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
.content-tags { position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
.content-tag { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.14); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 20px; }
.shared-badge { position: absolute; top: 14px; left: 14px; z-index: 2; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; box-shadow: 0 4px 12px rgba(232,41,79,0.4); }

.content-actions { padding: 14px; display: flex; gap: 10px; }
.watch-now-btn {
  flex: 1; min-width: 0; height: 48px; border: none; border-radius: 18px; background: var(--accent); color: #fff;
  font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  box-shadow: 0 8px 20px rgba(232,41,79,0.32);
}
.watch-now-btn svg { width: 20px; height: 20px; }
.share-btn {
  width: 48px; height: 48px; flex-shrink: 0; border-radius: 18px; background: #1a1316; border: 1px solid var(--line);
  color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.share-btn svg { width: 20px; height: 20px; }

/* loading */
.spinner { width: 38px; height: 38px; margin: 0 auto; border: 4px solid rgba(255,255,255,0.12); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loadingBox { display: none; text-align: center; padding: 44px 20px; }
#loadingText { font-size: 14px; font-weight: 700; color: #ffe3e8; margin-top: 16px; }
#loadingHint { font-size: 12px; color: var(--muted); margin-top: 6px; }
#retryBtn { display: none; margin-top: 14px; background: var(--accent); color: #fff; border: none; padding: 11px 24px; border-radius: 20px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; }
#emptyState { display: none; text-align: center; padding: 40px; color: var(--muted); }

</style>

<script>
/* =====================================================================
   app.js — shared by all pages (navigation, API, toast)
   Sab kuch window.App ke andar hai, taaki pages ke apne variables se
   (jaise `tg`) kuch na takraye.
   ===================================================================== */
(function () {
  'use strict';

  const API_BASE = 'https://animezone-bot.onrender.com';
  const tg = (window.Telegram && window.Telegram.WebApp) || null;

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#36000f'); } catch (e) {}
    try { tg.setBackgroundColor('#0b0005'); } catch (e) {}
    try { tg.setBottomBarColor('#2f000e'); } catch (e) {}
  }

  /* ---------- Telegram fullscreen: upar Close button / neeche system bar ke liye jagah ---------- */
  function applyInsets() {
    if (!tg) return;
    const sa = tg.safeAreaInset || {};
    const ca = tg.contentSafeAreaInset || {};
    let top = (sa.top || 0) + (ca.top || 0);
    let bottom = sa.bottom || 0;
    if (tg.isFullscreen) {               // Telegram ne value na di to bhi kuch jagah chhodo
      if (top < 60) top = 84;
      if (bottom < 12) bottom = 20;
    }
    const root = document.documentElement;
    root.style.setProperty('--safe-top', top + 'px');
    root.style.setProperty('--safe-bottom', bottom + 'px');
  }
  applyInsets();
  if (tg && tg.onEvent) {
    ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged'].forEach((ev) => {
      try { tg.onEvent(ev, applyInsets); } catch (e) {}
    });
  }

  /* ---------- icons ---------- */
  const ICONS = {
    collections: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>',
    home: '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
    games: '<svg viewBox="0 0 24 24"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect x="2" y="6" width="20" height="12" rx="4"/></svg>',
    store: '<svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
    content: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg>',
    profile: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  };
  const PAGES = [
    { id: 'collections', href: 'collections.html', label: 'Collections' },
    { id: 'content', href: 'exclusive.html', label: 'Content' },
    { id: 'store', href: 'store.html', label: 'Store' },
    { id: 'profile', href: 'profile.html', label: 'Profile' },
  ];

  const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- navigation ---------- */
  function go(href) { window.location.href = href; }

  function mountNav() {
    const el = document.getElementById('appNav');
    if (!el || el.getAttribute('data-ready')) return;
    el.setAttribute('data-ready', '1');
    const current = document.body.getAttribute('data-page');
    const cur = Math.max(0, PAGES.findIndex((p) => p.id === current));

    el.innerHTML = '<div class="nav-pill"></div>' + PAGES.map((p, i) =>
      `<button class="nav-btn ${i === cur ? 'active' : ''}" data-href="${p.href}" aria-label="${p.label}">${ICONS[p.id]}<span>${p.label}</span></button>`
    ).join('');

    const pill = el.querySelector('.nav-pill');
    const btns = Array.prototype.slice.call(el.querySelectorAll('.nav-btn'));

    // Pichle page se aaye ho to pill wahin se shuru ho kar naye tab tak slide kare
    let from = -1;
    try {
      from = parseInt(sessionStorage.getItem('navFrom'), 10);
      sessionStorage.removeItem('navFrom');
    } catch (e) {}
    if (from >= 0 && from < PAGES.length && from !== cur) {
      pill.style.transition = 'none';
      pill.style.setProperty('--i', from);
      btns[cur].classList.remove('active');
      btns[from].classList.add('active');
      void pill.offsetWidth;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        pill.style.transition = '';
        pill.style.setProperty('--i', cur);
        btns[from].classList.remove('active');
        btns[cur].classList.add('active');
      }));
    } else {
      pill.style.setProperty('--i', cur);
    }

    let leaving = false;
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-href]');
      if (!b || leaving || b === btns[cur]) return;
      leaving = true;
      try { sessionStorage.setItem('navFrom', String(cur)); } catch (err) {}
      document.body.classList.add('leaving');          // page halka sa fade-out
      setTimeout(() => go(b.getAttribute('data-href')), 140);
    });
  }
  // Back button se wapas aao to fade-out wali halat hata do
  window.addEventListener('pageshow', () => document.body.classList.remove('leaving'));

  /* ---------- API (Telegram login header ke saath) ---------- */
  async function api(path, opts) {
    opts = opts || {};
    const res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': (tg && tg.initData) || '',
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      if (res.status === 403 && data && data.error === 'join_required') {   // channel join pending: gate dikhao
        try { sessionStorage.removeItem('azGateOk'); } catch (e) {}
        showGate(data.channels || []);
      }
      const err = new Error((data && (data.message || data.error)) || ('HTTP ' + res.status));
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  const fmt = (n) => Number(n || 0).toLocaleString('en-IN');

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(msg) {
    let t = document.getElementById('appToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'appToast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }


  /* ---------- channel join gate (3 channels join karo, phir Verify) ---------- */
  function openLink(u) {
    try {
      if (tg && /^https:\/\/t\.me\//.test(u) && tg.openTelegramLink) tg.openTelegramLink(u);
      else if (tg && tg.openLink) tg.openLink(u);
      else window.open(u, '_blank');
    } catch (e) {}
  }
  function removeGate() { const g = document.getElementById('azGate'); if (g) g.remove(); }
  function showGate(channels, message) {
    if (!document.getElementById('azGateCss')) {
      const st = document.createElement('style');
      st.id = 'azGateCss';
      st.textContent = '#azGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-top,0px) + 20px) 20px calc(var(--safe-bottom,0px) + 20px);background:rgba(11,0,5,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-family:Inter,system-ui,sans-serif;color:#fff}' +
        '#azGate .gate-card{width:100%;max-width:380px;max-height:100%;overflow:auto;padding:26px 22px;border-radius:28px;background:linear-gradient(160deg,rgba(232,41,79,.26),rgba(60,0,20,.9));border:1px solid rgba(255,255,255,.12);text-align:center}' +
        '#azGate .gate-ico{font-size:40px}#azGate h2{margin:8px 0 6px;font-size:22px;font-weight:900}#azGate p{margin:0 0 18px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.7)}' +
        '#azGate .gate-row{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);text-align:left}' +
        '#azGate .gate-t{flex:1;min-width:0;font-size:15px;font-weight:800;overflow-wrap:anywhere}' +
        '#azGate .gate-join{height:38px;padding:0 18px;border:none;border-radius:12px;background:#E8294F;color:#fff;font:inherit;font-size:14px;font-weight:800}' +
        '#azGate .gate-ok{font-size:13px;font-weight:800;color:#34D399}' +
        '#azGate .gate-verify{width:100%;height:52px;margin-top:8px;border:none;border-radius:18px;background:#fff;color:#7A0A30;font:inherit;font-size:16px;font-weight:900}' +
        '#azGate .gate-verify:disabled{opacity:.6}#azGate .gate-msg{min-height:18px;margin-top:12px;font-size:13px;line-height:1.45;color:#FCA5A5}';
      document.head.appendChild(st);
    }
    let g = document.getElementById('azGate');
    if (!g) { g = document.createElement('div'); g.id = 'azGate'; document.body.appendChild(g); }
    const list = channels || [];
    g.innerHTML = '<div class="gate-card"><div class="gate-ico">🔒</div><h2>Join to continue</h2><p>Join all the channels below, then tap Verify.</p>' +
      list.map((c, i) => '<div class="gate-row"><div class="gate-t">' + escHtml(c.title) + '</div>' + (c.joined ? '<span class="gate-ok">✓ Joined</span>' : '<button class="gate-join" data-i="' + i + '">Join</button>') + '</div>').join('') +
      '<button class="gate-verify" id="gateVerify">✅ I\'ve joined — Verify</button><div class="gate-msg" id="gateMsg">' + escHtml(message || '') + '</div></div>';
    g.onclick = async (e) => {
      const j = e.target.closest('.gate-join');
      if (j) { const c = list[Number(j.getAttribute('data-i'))]; if (c && c.link) openLink(c.link); return; }
      if (!e.target.closest('#gateVerify')) return;
      const btn = document.getElementById('gateVerify'), msg = document.getElementById('gateMsg');
      btn.disabled = true; btn.textContent = 'Checking…'; msg.textContent = '';
      try {
        const r = await api('/api/membership/verify', { method: 'POST' });
        if (r.ok) {
          try { sessionStorage.setItem('azGateOk', JSON.stringify({ at: Date.now() })); } catch (err) {}
          removeGate(); toast('Verified ✅');
          try { window.dispatchEvent(new CustomEvent('az-gate-ok')); } catch (err) {}
        } else {
          showGate(r.channels, 'You haven\'t joined: ' + r.channels.filter((c) => !c.joined).map((c) => c.title).join(', ') + '. Join, then tap Verify again.');
        }
      } catch (err) {
        btn.disabled = false; btn.textContent = '✅ I\'ve joined — Verify';
        msg.textContent = 'Couldn\'t verify. Check your connection and try again.';
      }
    };
  }
  async function gateCheck() {
    if (/[?&]demo=1/.test(window.location.search)) return;
    try { const c = JSON.parse(sessionStorage.getItem('azGateOk') || 'null'); if (c && Date.now() - c.at < 60000) return; } catch (e) {}
    try {
      const r = await api('/api/membership');
      if (r && r.ok) { try { sessionStorage.setItem('azGateOk', JSON.stringify({ at: Date.now() })); } catch (e) {} removeGate(); }
      else if (r && r.channels) showGate(r.channels);
    } catch (e) { /* server so raha ho to kuch mat roko: har action par server khud check karta hai */ }
  }

  // Nav turant lagao (script body ke end mein hai), taaki pehle paint se hi dikhe
  if (document.getElementById('appNav')) mountNav();
  else document.addEventListener('DOMContentLoaded', mountNav);

  setTimeout(gateCheck, 0);

  window.App = { API_BASE, tg, api, go, toast, fmt, icons: ICONS, gateCheck, showGate };
})();

</script>
<script>

window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
const tg = window.Telegram.WebApp;

const API_BASE = "https://animezone-bot.onrender.com";


let contentData = [];
let activeFilter = 'all';

// DNS DETECTION (Fetch Method)
async function isAdBlockActive() {
    if (typeof window.show_11482366 !== 'function') return true;
    try {
        await fetch('https://libtl.com/sdk.js', { mode: 'no-cors', cache: 'no-store' });
        return false;
    } catch (e) { return true; }
}

// ---------- HELPERS ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
));

// "Dark 💀", "dark", "DARK" → "dark" (sirf letters, chhote)
function regionKey(c) {
  return String(c.region || '').toLowerCase().replace(/[^a-z]/g, '');
}

// Search: title ya episode number. "0001", "01", "1" teeno episode 1 dhundhte hain
function matchesSearch(c, term) {
  const title = String(c.title || '').toLowerCase();
  const ep = String(c.episode || '').toLowerCase();
  if (/^\d+$/.test(term)) {
    const m = ep.match(/^\D*(\d+)\D*$/);
    if (m && parseInt(m[1], 10) === parseInt(term, 10)) return true;
    return title.includes(term);
  }
  return title.includes(term) || ep.includes(term);
}

// ---------- LOADING (Render server dheere jagta hai) ----------
const LOAD_ESTIMATE_SEC = 45;           // server jagne ka andaaza
const CACHE_KEY = 'exclusiveCache_v1';
// Friend ke share link se aaye ho (?c=x001) to wahi content sabse upar dikhao
const sharedId = (() => {
  const c = new URLSearchParams(window.location.search).get('c');
  return c && /^x\d{1,6}$/.test(c) ? c : null;
})();

let loaded = false;
let isLoading = false;
let countdownTimer = null;
let showLoaderTimer = null;

function startCountdown() {
  const box = document.getElementById('loadingBox');
  const text = document.getElementById('loadingText');
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('loadingHint').style.display = 'block';
  document.getElementById('retryBtn').style.display = 'none';
  let left = LOAD_ESTIMATE_SEC;
  const tick = () => {
    text.textContent = left > 0 ? `Content will be ready in ${left} sec…` : 'Almost ready…';
    if (left > 0) left--;
  };
  box.style.display = 'block';
  tick();
  clearInterval(countdownTimer);
  countdownTimer = setInterval(tick, 1000);
}

function stopCountdown() {
  clearTimeout(showLoaderTimer);
  clearInterval(countdownTimer);
  document.getElementById('loadingBox').style.display = 'none';
}

function showLoadError() {
  clearInterval(countdownTimer);
  document.getElementById('loadingBox').style.display = 'block';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('loadingHint').style.display = 'none';
  document.getElementById('loadingText').textContent = 'Couldn\'t connect to the server.';
  document.getElementById('retryBtn').style.display = 'inline-block';
}

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('loadingBox').style.display = 'none';
  loadExclusive();
});

async function loadExclusive() {
  if (isLoading) return;
  isLoading = true;

  // 1) Pehle se load (cached) hai to turant dikhao, countdown nahi
  let hadCache = false;
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (Array.isArray(cached) && cached.length > 0) {
      contentData = cached;
      loaded = true;
      hadCache = true;
      renderGrid();
    }
  } catch (e) {}

  // 2) Cache nahi hai aur server dheere de raha hai to countdown (tez load pe kuch nahi dikhega)
  if (!hadCache) {
    clearTimeout(showLoaderTimer);
    showLoaderTimer = setTimeout(startCountdown, 1200);
  }

  // 3) Server se fresh data, fail ho to 6 baar tak retry
  for (let attempt = 0; attempt < 6; attempt++) {
    try {
      const res = await fetch(`${API_BASE}/api/exclusive-content`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('Bad data');
      contentData = data;
      loaded = true;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
      stopCountdown();
      isLoading = false;
      renderGrid();
      return;
    } catch (err) {
      console.error(err);
      await new Promise((r) => setTimeout(r, 4000));
    }
  }
  isLoading = false;
  if (!hadCache) {
    clearTimeout(showLoaderTimer);
    showLoadError();
  }
}

// ---------- IMAGE HELPERS ----------
// Agar post ki image load na ho ya mile hi na, to card par saaf "Preview not available yet" dikhta hai.
// Apni default image dikhani ho to yahan https link daal do (khaali chhodo to designed placeholder dikhega).
const FALLBACK_IMAGE = '';

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>';
const ICON_NOIMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/><path d="M3 3l18 18"/></svg>';

// CSS url() ke liye safe link (sirf http/https/data:image)
function safeImg(url) {
  const u = String(url || '').trim();
  if (!(/^https?:\/\//i.test(u) || /^data:image\//i.test(u))) return '';
  const map = { "'": '%27', '"': '%22', '(': '%28', ')': '%29', '\\': '%5C', '<': '%3C', '>': '%3E', ' ': '%20', '\n': '%0A', '\r': '%0D' };
  return u.replace(/['"()\\<> \n\r]/g, (c) => map[c]);
}

// Thumbnail hai hi nahi (ya backend ne placeholder diya)
function isMissingThumb(u) {
  const s = String(u || '').trim();
  if (!s || s === '#' || /via\.placeholder\.com/i.test(s)) return true;
  return !(/^https?:\/\//i.test(s) || /^data:image\//i.test(s));
}

// Image load fail hui to fallback dikhao
function thumbFail(img) {
  const t = img.closest('.content-thumb');
  if (t) t.classList.add('no-img');
}

function fallbackHTML() {
  const custom = safeImg(FALLBACK_IMAGE);
  return `<div class="thumb-fallback"${custom ? ` style="background-image:url('${custom}')"` : ''}>${ICON_NOIMG}<span>Preview not available yet</span></div>`;
}

function renderGrid() {
  const grid = document.getElementById('contentGrid');
  const empty = document.getElementById('emptyState');
  const searchTerm = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  // Data aane se pehle "kuch nahi hai" mat dikhao
  if (!loaded && contentData.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'none';
    return;
  }

  let filtered = contentData;
  if (activeFilter === 'today') {
      const today = new Date().toISOString().slice(0, 10);
      filtered = filtered.filter(c => c.uploadDate === today);
  } else if (activeFilter === 'indian') {
      filtered = filtered.filter(c => regionKey(c) === 'indian');
  } else if (activeFilter === 'world') {
      filtered = filtered.filter(c => { const k = regionKey(c); return k && k !== 'indian' && k !== 'dark'; });
  } else if (activeFilter === 'dark') {
      filtered = filtered.filter(c => regionKey(c) === 'dark');
  }

  if (searchTerm) {
    filtered = filtered.filter(c => matchesSearch(c, searchTerm));
  }

  // Shared content sabse upar (All tab, bina search ke)
  if (sharedId && activeFilter === 'all' && !searchTerm) {
    filtered = [...filtered].sort((a, b) => (b.id === sharedId) - (a.id === sharedId));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((item) => {
    const missing = isMissingThumb(item.thumbnail);
    const bg = missing ? '' : safeImg(item.thumbnail);
    return `
    <div class="content-card">
      <div class="content-thumb ${missing ? 'no-img' : ''}">
        ${missing ? '' : `<div class="thumb-bg" style="background-image:url('${bg}')"></div>
        <img class="thumb-img" src="${esc(item.thumbnail)}" alt="${esc(item.title)}" onerror="thumbFail(this)">`}
        ${fallbackHTML()}
        ${sharedId && item.id === sharedId ? '<div class="shared-badge">📩 Shared with you</div>' : ''}
        <div class="content-title-overlay">${esc(item.title)}</div>
        <div class="content-tags">
          <span class="content-tag">Episode ${esc(item.episode)}</span>
          ${item.duration ? `<span class="content-tag">${esc(item.duration)}</span>` : ''}
          ${item.region ? `<span class="content-tag">${esc(item.region)}</span>` : ''}
        </div>
      </div>
      <div class="content-actions">
        <button class="watch-now-btn" onclick="openExclusiveContent('${esc(item.id)}')">
          ${ICON_PLAY} Watch Now
        </button>
        ${item.shareLink ? `<button class="share-btn" aria-label="Share" onclick="shareContent('${esc(item.id)}')">${ICON_SHARE}</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ---------- SHARE ----------
function copyShareLink(link) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link)
      .then(() => alert('Link copied!'))
      .catch(() => prompt('Copy this link:', link));
  } else {
    prompt('Copy this link:', link);
  }
}

function shareContent(id) {
  const item = contentData.find((c) => c.id === id);
  if (!item || !item.shareLink) return;
  const text = `${item.title} 🔥 Watch it here:`;
  const url = 'https://t.me/share/url?url=' + encodeURIComponent(item.shareLink) + '&text=' + encodeURIComponent(text);
  try {
    tg.openTelegramLink(url);
  } catch (e) {
    copyShareLink(item.shareLink);
  }
}

// ACTION WITH DNS SECURITY: pehle ad, phir main bot content seedha tumhare chat mein bhejta hai
let sending = false;
let sentTimer = null;
let adFreeUntil = 0;
function paintAdFree() {
  const chip = document.getElementById('adfreeChip');
  if (adFreeUntil > Date.now()) { const ms = adFreeUntil - Date.now(), d = Math.floor(ms / 86400000), h = Math.floor((ms % 86400000) / 3600000), m = Math.floor((ms % 3600000) / 60000); chip.textContent = '✨ Ad-free · ' + (d ? d + 'd ' : '') + h + 'h ' + m + 'm left'; chip.style.display = 'inline-block'; }
  else chip.style.display = 'none';
}
App.api('/api/adfree').then((r) => { adFreeUntil = r && r.until ? Date.parse(r.until) : 0; paintAdFree(); }).catch(() => {});
setInterval(paintAdFree, 60000);
function showSent(text, isErr, withChat) {
  const bar = document.getElementById('sentBar');
  document.getElementById('sentText').textContent = text;
  document.getElementById('sentOpen').style.display = withChat ? 'inline-block' : 'none';
  bar.classList.toggle('err', !!isErr);
  bar.classList.add('show');
  clearTimeout(sentTimer);
  sentTimer = setTimeout(() => bar.classList.remove('show'), isErr ? 5000 : 9000);
}
document.getElementById('sentOpen').addEventListener('click', () => { try { tg.close(); } catch (e) {} });

async function openExclusiveContent(id) {
    if (sending) return;
    sending = true;                       // turant lock: double tap par dusri request na jaye
    const adFree = adFreeUntil > Date.now();   // refer se mile ad-free din: na ad, na DNS check
    if (!adFree) {
        const blocked = await isAdBlockActive();
        if (blocked) {
            sending = false;
            alert("⚠️ DNS / Ad-Blocker Detected!\n\nPlease disable Private DNS (AdGuard) or Ad-blocker to watch exclusive content.");
            return;
        }
        try { await window.show_11482366(); } catch (e) { /* ad fail ho to bhi content do */ }
    }
    showSent('Sending to your Telegram chat…', false, false);
    try {
        const r = await App.api('/api/content/send', { method: 'POST', body: { id } });
        showSent('✅ Sent to your Telegram chat. It is removed automatically in ' + r.minutes + ' min.', false, true);
    } catch (e) {
        if (e.status === 403 && e.data && e.data.error === 'join_required') { document.getElementById('sentBar').classList.remove('show'); }
        else showSent((e.data && e.data.message) || (e.status === 401 ? 'Please open this app from the Telegram bot.' : 'Couldn\'t send this right now. Please try again.'), true, false);
    }
    sending = false;
}

document.getElementById('filterRow').addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-pill')) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  renderGrid();
});

document.getElementById('searchInput').addEventListener('input', renderGrid);

loadExclusive();

</script>
</body>
