<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AnimeZone - Category</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
:root { --primary: #7C3AED; }

body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #1a1a2e;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 12px;
  background: #ffffff;
  border-bottom: 1px solid #f0f0f0;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #F3F4F6;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.back-btn .material-icons-round { font-size: 20px; color: #374151; }
.page-title { font-size: 17px; font-weight: 800; text-transform: capitalize; }

.scroll-area { flex: 1; overflow-y: auto; padding: 14px; }
.scroll-area::-webkit-scrollbar { display: none; }

.anime-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.anime-card {
  background: white; border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  cursor: pointer;
}
.poster-wrap {
  position: relative; width: 100%; aspect-ratio: 2/3;
  overflow: hidden;
  background: linear-gradient(135deg, #7C3AED, #A78BFA);
}
.poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
.ep-badge {
  position: absolute; top: 7px; right: 7px;
  background: rgba(0,0,0,0.7); color: white;
  font-size: 10px; font-weight: 700;
  padding: 3px 7px; border-radius: 7px;
}
.anime-info { padding: 9px 11px 11px; }
.anime-info h3 {
  font-size: 13px; font-weight: 700; color: #1a1a2e;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.anime-info .meta { font-size: 11px; color: #9CA3AF; margin-top: 3px; }

.empty-state { text-align: center; padding: 60px 24px; color: #9CA3AF; font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" onclick="window.location.href='index.html'">
    <span class="material-icons-round">arrow_back</span>
  </div>
  <div class="page-title" id="pageTitle">Category</div>
</div>

<div class="scroll-area">
  <div class="anime-grid" id="animeGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">Is category mein abhi kuch nahi hai.</div>
</div>

<script>
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();

// ⚠️ CONFIG — Termux tunnel URL yahan daalo
const API_BASE = "https://directions-question-inch-programmers.trycloudflare.com";

const params = new URLSearchParams(window.location.search);
const tag = params.get('tag') || 'trending';

document.getElementById('pageTitle').textContent = tag;

async function loadCategory() {
  try {
    const res = await fetch(`${API_BASE}/api/anime-by-category/${encodeURIComponent(tag)}`);
    const list = await res.json();
    renderGrid(list);
  } catch (err) {
    console.error(err);
  }
}

function renderGrid(list) {
  const grid = document.getElementById('animeGrid');
  const empty = document.getElementById('emptyState');

  if (list.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.innerHTML = list.map((a) => `
    <div class="anime-card" onclick="window.location.href='detail.html?id=${a.id}'">
      <div class="poster-wrap">
        <img src="${a.thumbnail}" alt="${a.name}">
        <div class="ep-badge">EP ${a.episodeCount}</div>
      </div>
      <div class="anime-info">
        <h3>${a.name}</h3>
        <div class="meta">${a.meta || ''}</div>
      </div>
    </div>
  `).join('');
}

loadCategory();
</script>
</body>
</html>
