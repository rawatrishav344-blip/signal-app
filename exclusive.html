<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AnimeZone - Exclusive</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='11482366' data-sdk='show_11482366'></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
:root { --primary: #F59E0B; --primary-dark: #B45309; }

body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #1a1a2e;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  gap: 10px;
  background: #ffffff;
}
.logo { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.logo-icon { width: 34px; height: 34px; }
.logo-text { display: flex; flex-direction: column; line-height: 1; }
.logo-text .top { font-size: 13px; font-weight: 900; color: #1a1a2e; letter-spacing: 1px; }
.logo-text .top span { color: var(--primary); }
.logo-text .bottom { font-size: 7px; font-weight: 700; letter-spacing: 3px; color: #9CA3AF; }

.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #F3F4F6;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.back-btn .material-icons-round { font-size: 20px; color: #374151; }

.scroll-area { flex: 1; overflow-y: auto; }
.scroll-area::-webkit-scrollbar { display: none; }

/* SEARCH */
.search-tap {
  margin: 10px 14px 0;
  background: #F3F4F6;
  border-radius: 20px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-tap .material-icons-round { color: #9CA3AF; font-size: 18px; }
.search-tap input {
  border: none; outline: none; background: transparent;
  font-size: 13px; width: 100%; font-family: 'Inter', sans-serif; color: #1a1a2e;
}

/* FILTER PILLS */
.filter-row {
  display: flex; gap: 8px;
  padding: 12px 14px 4px;
  overflow-x: auto;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-pill {
  background: #F3F4F6;
  border: none;
  color: #6B7280;
  font-family: 'Inter', sans-serif;
  font-size: 12.5px; font-weight: 700;
  padding: 8px 15px;
  border-radius: 20px;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.filter-pill.active { background: var(--primary); color: white; }

.exclusive-banner {
  margin: 14px 14px 0;
  background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
  border: 1.5px solid #FDE68A;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.exclusive-banner .material-icons-round { font-size: 26px; color: var(--primary); }
.exclusive-banner-text h2 { font-size: 14px; font-weight: 800; color: #92400E; }
.exclusive-banner-text p { font-size: 11px; color: #B45309; margin-top: 2px; }

/* CONTENT GRID */
.content-grid {
  display: flex; flex-direction: column;
  gap: 18px; margin: 0 14px 20px;
}
.content-card {
  background: white; border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,0.09);
}
.content-thumb {
  position: relative; width: 100%; aspect-ratio: 2/3;
  overflow: hidden;
  background: #f3f3f3;
}
.content-thumb img { width: 100%; height: 100%; object-fit: cover; }
.content-thumb::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%);
}
.content-title-overlay {
  position: absolute; bottom: 42px; left: 12px; right: 12px;
  z-index: 2; color: white; font-size: 16px; font-weight: 800;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}
.content-tags {
  position: absolute; bottom: 12px; left: 12px;
  display: flex; gap: 6px; z-index: 2;
}
.content-tag {
  background: rgba(0,0,0,0.6); color: white;
  font-size: 10px; font-weight: 600;
  padding: 4px 10px; border-radius: 20px;
}
.content-actions { padding: 12px; }
.watch-now-btn {
  width: 100%;
  background: var(--primary);
  color: white; border: none;
  padding: 13px 0; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer;
}

/* NAVBAR */
.navbar {
  background: white;
  display: flex; justify-content: space-around;
  padding: 10px 0 14px;
  border-top: 1px solid #f0f0f0;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; padding: 6px 20px; border-radius: 12px; gap: 3px;
}
.nav-item .material-icons-round { font-size: 24px; color: #9CA3AF; }
.nav-label { font-size: 11px; color: #9CA3AF; font-weight: 500; }
.nav-item.active { background: #FFFBEB; }
.nav-item.active .material-icons-round, .nav-item.active .nav-label { color: var(--primary); }
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" onclick="window.location.href='index.html'">
    <span class="material-icons-round">arrow_back</span>
  </div>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="20" fill="#F59E0B"/>
      <path d="M20 12 L28 20 L20 28 L12 20 Z" fill="white"/>
    </svg>
    <div class="logo-text">
      <div class="top">EXCLU<span>SIVE</span></div>
      <div class="bottom">ZONE</div>
    </div>
  </div>
</div>

<div class="scroll-area">
  <div class="search-tap">
    <span class="material-icons-round">search</span>
    <input type="text" id="searchInput" placeholder="Search exclusive content...">
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-pill active" data-filter="all">All 🧧</button>
    <button class="filter-pill" data-filter="today">Today ⚡</button>
    <button class="filter-pill" data-filter="indian">Indian 💥</button>
    <button class="filter-pill" data-filter="world">World 🌎</button>
    <button class="filter-pill" data-filter="dark">DARK 💀</button>
  </div>

  <div class="exclusive-banner">
    <span class="material-icons-round">workspace_premium</span>
    <div class="exclusive-banner-text">
      <h2>Exclusive Unlocked</h2>
      <p>Yeh content sirf code se hi milta hai</p>
    </div>
  </div>

  <div class="content-grid" id="contentGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none; text-align:center; padding:40px; color:#9CA3AF;">Is category mein abhi kuch nahi hai.</div>
</div>

<div class="navbar">
  <div class="nav-item" onclick="window.location.href='earning.html'">
    <span class="material-icons-round">account_balance_wallet</span>
    <span class="nav-label">Earning</span>
  </div>
  <div class="nav-item" onclick="window.location.href='index.html'">
    <span class="material-icons-round">home</span>
    <span class="nav-label">Home</span>
  </div>
  <div class="nav-item active">
    <span class="material-icons-round">workspace_premium</span>
    <span class="nav-label">Exclusive</span>
  </div>
</div>

<script>
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
const tg = window.Telegram.WebApp;

const API_BASE = "https://animezone-bot.onrender.com";

// Security Guard
if (sessionStorage.getItem('exclusiveUnlocked') !== 'true') {
  window.location.href = 'index.html';
}

let contentData = [];
let activeFilter = 'all';

// DNS DETECTION (Fetch Method)
async function isAdBlockActive() {
    if (typeof window.show_11482366 !== 'function') return true;
    try {
        await fetch('https://libtl.com/sdk.js', { mode: 'no-cors', cache: 'no-store' });
        return false;
    } catch (e) { return true; }
}

async function loadExclusive() {
  try {
    const res = await fetch(`${API_BASE}/api/exclusive-content`);
    contentData = await res.json();
    renderGrid();
  } catch (err) { console.error(err); }
}

function renderGrid() {
  const grid = document.getElementById('contentGrid');
  const empty = document.getElementById('emptyState');
  const searchTerm = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = contentData;
  if (activeFilter === 'today') {
      const today = new Date().toISOString().slice(0, 10);
      filtered = filtered.filter(c => c.uploadDate === today);
  } else if (activeFilter === 'indian') {
      filtered = filtered.filter(c => (c.region || '').toLowerCase() === 'indian');
  } else if (activeFilter === 'world') {
      filtered = filtered.filter(c => c.region && c.region.toLowerCase() !== 'indian');
  }

  if (searchTerm) {
    filtered = filtered.filter(c => c.title.toLowerCase().includes(searchTerm));
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((item) => `
    <div class="content-card">
      <div class="content-thumb">
        <img src="${item.thumbnail}" alt="${item.title}">
        <div class="content-title-overlay">${item.title}</div>
        <div class="content-tags">
          <span class="content-tag">Episode ${item.episode}</span>
          ${item.duration ? `<span class="content-tag">${item.duration}</span>` : ''}
          ${item.region ? `<span class="content-tag">${item.region}</span>` : ''}
        </div>
      </div>
      <div class="content-actions">
        <button class="watch-now-btn" onclick="openExclusiveContent('${item.deeplink}')">
          <span class="material-icons-round">play_arrow</span> Watch Now
        </button>
      </div>
    </div>
  `).join('');
}

// ACTION WITH DNS SECURITY
async function openExclusiveContent(deeplink) {
    const blocked = await isAdBlockActive();
    if (blocked) {
        alert("⚠️ DNS / Ad-Blocker Detected!\n\nPlease disable Private DNS (AdGuard) or Ad-blocker to watch exclusive content.");
        return;
    }
    
    try {
        window.show_11482366().then(() => {
            tg.openTelegramLink(deeplink);
        }).catch(() => {
            tg.openTelegramLink(deeplink);
        });
    } catch (e) {
        tg.openTelegramLink(deeplink);
    }
}

document.getElementById('filterRow').addEventListener('click', (e) => {
  if (!e.target.classList.contains('filter-pill')) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  renderGrid();
});

document.getElementById('searchInput').addEventListener('input', renderGrid);

loadExclusive();
</script>
</body>
</html>
